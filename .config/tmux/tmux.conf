# Workspace layer under Ghostty: one session per project (sesh), windows are the tabs.
# On macOS, Ghostty's cmd keys send the prefix sequences below (see ~/.config/ghostty/config).

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:extkeys"
set -s escape-time 0
set -s extended-keys always   # Shift+Enter reaches zsh as ESC[27;2;13~ instead of a plain Enter
set -s set-clipboard on       # copies go to the system clipboard via OSC 52
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off  # closing a session's last window moves to another session
# Tab label: folder, plus whatever is running in it ("web · node").
setw -g automatic-rename-format '#{b:pane_current_path}#{?#{!=:#{pane_current_command},zsh}, · #{pane_current_command},}'

bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind o display-popup -E -w 60% -h 60% "sesh picker -ctdi"

# Blocks: zsh marks prompts/outputs (OSC 133), so these jump between commands and copy the last output.
bind k if -F "#{pane_in_mode}" "send -X previous-prompt" "copy-mode; send -X previous-prompt; send -X previous-prompt"
bind j if -F "#{pane_in_mode}" "send -X next-prompt"
bind y copy-mode \; send -X previous-prompt -o \; send -X begin-selection \; send -X next-prompt \; send -X cursor-up \; send -X cursor-up \; send -X end-of-line \; send -X copy-selection-and-cancel \; display "copied last output"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Look: TokyoNight Night, tab bar on top, transparent so Ghostty's blur shows through.
set -g status-position top
set -g status-interval 30
set -g status-style "bg=default,fg=#565f89"
set -g status-left-length 40
set -g status-left "#[fg=#7aa2f7]#[fg=#1a1b26,bg=#7aa2f7,bold]#S#[fg=#7aa2f7,bg=default]  "
set -g status-right "#{?client_prefix,#[fg=#e0af68]● ,}#[fg=#565f89]%H:%M "
setw -g window-status-separator " "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#292e42]#[fg=#c0caf5,bg=#292e42,bold]#I #W#[fg=#292e42,bg=default]"
setw -g window-status-activity-style "fg=#e0af68"
set -g pane-border-lines single
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=#2e3c64,fg=#c0caf5"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#7aa2f7"
set -g set-titles on
set -g set-titles-string "#S · #W"
