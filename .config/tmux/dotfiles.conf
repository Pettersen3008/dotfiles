# Shared tmux behavior, layered on top of a base config: tmux.conf here on macOS, Omarchy's own tmux.conf on Linux
# (which sources this file). Only free prefix keys are bound here, so Omarchy's bindings stay intact.
# Ghostty's keybinds send these with the C-b prefix (prefix2 on Omarchy).

set -s extended-keys always   # Shift+Enter reaches zsh as an extended key instead of a plain Enter
# Tab label: folder, plus whatever is running in it ("web · node").
setw -g automatic-rename-format '#{b:pane_current_path}#{?#{!=:#{pane_current_command},zsh}, · #{pane_current_command},}'

bind o display-popup -E -w 60% -h 60% "sesh picker -ctdi"
bind O display-popup -E -w 60% -h 60% "sesh picker -zi -p 'any project> '"  # every folder zoxide knows

# Blocks: zsh marks prompts/outputs (OSC 133), so these jump between commands and copy the last output.
bind u if -F "#{pane_in_mode}" "send -X previous-prompt" "copy-mode; send -X previous-prompt; send -X previous-prompt"
bind j if -F "#{pane_in_mode}" "send -X next-prompt"
bind y copy-mode \; send -X previous-prompt -o \; send -X begin-selection \; send -X next-prompt \; send -X cursor-up \; send -X cursor-up \; send -X end-of-line \; send -X copy-selection-and-cancel \; display "copied last output"
