add_newline = false
[git_status]
    conflicted = "!"
    ahead = "⇡"
    behind = "⇣"
    diverged = "⇕"
    style = "blue"
[cmd_duration]
    min_time = 1500
    format = "  took [$duration]($style)"
[directory]
    truncation_length = 3
    truncate_to_repo = false
    style = "bold white"
[username]
    disabled = true
[hostname]
    disabled = true