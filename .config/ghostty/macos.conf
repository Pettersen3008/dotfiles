theme = TokyoNight Night
font-size = 14

# tmux draws the tabs, so the titlebar just blends into the background.
macos-titlebar-style = transparent
macos-titlebar-proxy-icon = hidden
background-opacity = 0.92
background-blur = 20
window-colorspace = display-p3
scrollbar = system

# Warp-style keys, translated to tmux (prefix ctrl+b = \x02).
keybind = cmd+t=text:\x02c
keybind = cmd+w=text:\x02x
keybind = cmd+d=text:\x02%
keybind = cmd+shift+d=text:\x02"
keybind = cmd+p=text:\x02o
keybind = cmd+shift+p=text:\x02O
keybind = cmd+o=text:\x02w
keybind = cmd+k=text:\x0c
keybind = cmd+arrow_up=text:\x02k
keybind = cmd+arrow_down=text:\x02j
keybind = cmd+shift+c=text:\x02y
keybind = cmd+shift+enter=text:\x02z
keybind = cmd+alt+arrow_left=text:\x02\x1b[D
keybind = cmd+alt+arrow_right=text:\x02\x1b[C
keybind = cmd+alt+arrow_up=text:\x02\x1b[A
keybind = cmd+alt+arrow_down=text:\x02\x1b[B
keybind = cmd+1=text:\x021
keybind = cmd+2=text:\x022
keybind = cmd+3=text:\x023
keybind = cmd+4=text:\x024
keybind = cmd+5=text:\x025
keybind = cmd+6=text:\x026
keybind = cmd+7=text:\x027
keybind = cmd+8=text:\x028
keybind = cmd+9=text:\x029
