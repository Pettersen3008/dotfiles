# Omarchy: kept from its default Ghostty config so theme switching and Super+C/V keep working.
config-file = ?"~/.local/state/omarchy/current/theme/ghostty.conf"
font-size = 9
window-theme = ghostty
gtk-toolbar-style = flat
confirm-close-surface = false
resize-overlay = never
mouse-scroll-multiplier = 0.95
# https://github.com/ghostty-org/ghostty/discussions/3224
async-backend = epoll
keybind = shift+insert=paste_from_clipboard
keybind = control+insert=copy_to_clipboard
keybind = shift+enter=csi:13;2u
keybind = alt+shift+enter=csi:13;4u

# Same tmux keys as macOS, on ctrl+shift (Super belongs to Hyprland); alt+1-9 for tabs.
keybind = ctrl+shift+t=text:\x02c
keybind = ctrl+shift+w=text:\x02x
keybind = ctrl+shift+d=text:\x02%
keybind = ctrl+shift+e=text:\x02"
keybind = ctrl+shift+p=text:\x02o
keybind = ctrl+alt+p=text:\x02O
keybind = ctrl+shift+o=text:\x02w
keybind = ctrl+shift+enter=text:\x02z
keybind = ctrl+alt+arrow_up=text:\x02k
keybind = ctrl+alt+arrow_down=text:\x02j
keybind = ctrl+shift+y=text:\x02y
keybind = ctrl+shift+arrow_left=text:\x02\x1b[D
keybind = ctrl+shift+arrow_right=text:\x02\x1b[C
keybind = ctrl+shift+arrow_up=text:\x02\x1b[A
keybind = ctrl+shift+arrow_down=text:\x02\x1b[B
keybind = alt+1=text:\x021
keybind = alt+2=text:\x022
keybind = alt+3=text:\x023
keybind = alt+4=text:\x024
keybind = alt+5=text:\x025
keybind = alt+6=text:\x026
keybind = alt+7=text:\x027
keybind = alt+8=text:\x028
keybind = alt+9=text:\x029
