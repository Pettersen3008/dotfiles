# Omarchy: additions only. Omarchy's tmux already has Alt+1-9 tabs, Alt+Enter splits, Ctrl+Alt+arrows
# to focus splits and Ctrl+Space as prefix; these keys use its secondary prefix C-b (\x02).
keybind = ctrl+shift+p=text:\x02o
keybind = ctrl+alt+p=text:\x02O
keybind = ctrl+shift+o=text:\x02w
keybind = ctrl+shift+enter=text:\x02z
keybind = ctrl+shift+arrow_up=text:\x02u
keybind = ctrl+shift+arrow_down=text:\x02j
keybind = ctrl+shift+y=text:\x02y
